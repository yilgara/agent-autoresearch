[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-autoresearch"
version = "0.0.1"
description = "Auto-improve agent skill prompts from your eval pipeline output."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Ilgara Yusifzada" },
]
keywords = ["llm", "agents", "evaluation", "autoresearch", "skill-prompts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anthropic>=0.39",
  "click>=8.1",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
autoresearch = "agent_autoresearch.cli:cli"

# Entry-point group for adapter discovery — third-party packages register here:
#
# [project.entry-points."agent_autoresearch.adapters"]
# myeval = "myeval_adapter:MyEvalAdapter"
[project.entry-points."agent_autoresearch.adapters"]
csv         = "agent_autoresearch.adapters.csv:CSVAdapter"
jsonl_judge = "agent_autoresearch.adapters.jsonl_judge:JSONLJudgeAdapter"

[project.urls]
Homepage = "https://github.com/yilgara/agent-autoresearch"
Documentation = "https://github.com/yilgara/agent-autoresearch/tree/main/docs"
Issues = "https://github.com/yilgara/agent-autoresearch/issues"

[tool.hatch.build.targets.wheel]
packages = ["agent_autoresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
